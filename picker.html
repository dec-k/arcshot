<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose background image</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #1f2937; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; }
    .panel { text-align: center; max-width: 360px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; color: #475569; margin: 0 0 16px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .status { font-size: 12px; color: #64748b; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Choose a background image</h1>
    <p>Pick an image, then reopen the Screenshot Padder popover to see it applied.</p>
    <button id="pick" type="button">Choose image…</button>
    <input type="file" id="file" accept="image/*" hidden>
    <div id="status" class="status"></div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
