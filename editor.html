<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arcshot</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="card">
    <div class="top-row">
      <button id="copy" type="button" class="action">Copy</button>
      <button id="download" type="button" class="action primary">Download PNG</button>
    </div>

    <div class="preview" id="stage">
      <img id="screenshot" alt="Captured viewport">
    </div>

    <div class="bottom-row">
      <span id="swatch" class="swatch" title="Current background color"></span>
      <input type="range" id="hue" min="0" max="360" value="20" class="hue-slider">
      <button id="image-btn" type="button" class="icon-btn" title="Choose image…">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button id="clear-image" type="button" class="icon-btn" hidden title="Clear image">×</button>
      <button id="settings-btn" type="button" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <div id="status" class="status" hidden></div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
