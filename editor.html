<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screenshot Padder</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="toolbar">
    <label class="control">
      <span>Background</span>
      <input type="color" id="bg-color" value="#1e293b">
    </label>
    <button id="download" type="button">Download PNG</button>
  </header>

  <main class="stage" id="stage">
    <img id="screenshot" alt="Captured viewport">
  </main>

  <script src="editor.js"></script>
</body>
</html>
