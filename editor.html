<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screenshot Padder</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="card">
    <div class="top-row">
      <button id="copy" type="button" class="action">Copy</button>
      <button id="download" type="button" class="action primary">Download PNG</button>
    </div>

    <div class="preview" id="stage">
      <img id="screenshot" alt="Captured viewport">
    </div>

    <div class="bottom-row">
      <span id="swatch" class="swatch" title="Current background color"></span>
      <input type="range" id="hue" min="0" max="360" value="20" class="hue-slider">
      <button id="image-btn" type="button" class="icon-btn" title="Choose image…">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button id="clear-image" type="button" class="icon-btn" hidden title="Clear image">×</button>
    </div>

    <div id="status" class="status" hidden></div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
