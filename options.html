<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arcshot Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <img src="icons/arcshot-logo.png" alt="" class="logo" aria-hidden="true">
      <h1>Arcshot Settings</h1>
    </header>

    <section class="setting">
      <div class="setting-label">
        <h2>Background Size</h2>
        <p>Controls how wide the background around your capture is.</p>
      </div>
      <div class="setting-control" role="radiogroup" aria-label="Background size">
        <label class="radio">
          <input type="radio" name="bgSize" value="thin">
          <span>Thin</span>
        </label>
        <label class="radio">
          <input type="radio" name="bgSize" value="standard">
          <span>Standard <em>(default)</em></span>
        </label>
        <label class="radio">
          <input type="radio" name="bgSize" value="large">
          <span>Large</span>
        </label>
      </div>
    </section>

    <section class="setting">
      <div class="setting-label">
        <h2>Background Image</h2>
        <p>Specify a custom image to use as a background. When set, you'll be able to swap between Gradient and Image modes in the Capture window.</p>
      </div>
      <div class="setting-control">
        <div id="bg-image-preview" class="bg-image-preview" hidden>
          <img id="bg-image-thumb" alt="Background image preview">
        </div>
        <div id="bg-image-drop" class="bg-image-drop">
          <p>Drop an image here, or</p>
          <button type="button" id="bg-image-choose" class="btn">Choose image…</button>
          <input type="file" id="bg-image-file" accept="image/*" hidden>
        </div>
        <button type="button" id="bg-image-clear" class="btn btn-secondary" hidden>Remove image</button>
      </div>
    </section>

    <div id="status" class="status" hidden></div>
  </main>

  <script src="options.js"></script>
</body>
</html>
